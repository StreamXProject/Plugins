[package]
name = "streamx-spotify-native"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "streamx_spotify_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
librespot-audio = { path = "vendor/librespot/audio", default-features = false, features = ["rustls-tls-webpki-roots"] }
libc = "0.2"
librespot-core = { path = "vendor/librespot/core", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-playback = { path = "vendor/librespot/playback", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-metadata = { path = "vendor/librespot/metadata", default-features = false, features = ["rustls-tls-webpki-roots"] }
jni = "0.21"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
serde_json = "1"

[profile.release]
opt-level = "s"
strip = "debuginfo"
lto = "thin"
codegen-units = 1
